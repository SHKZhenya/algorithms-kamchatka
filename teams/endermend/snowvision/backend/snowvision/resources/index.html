<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>SnowVision Kamchatka</title><style>body{background:#0c1525;color:#eef4ff;font:16px system-ui;margin:0;padding:5vw}h1{font-size:40px;margin-bottom:8px}p{color:#a9b9cf}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:24px}article{background:#18253a;border:1px solid #30435e;border-radius:18px;overflow:hidden}article img{width:100%;aspect-ratio:16/9;object-fit:cover}section{padding:22px}button{background:#274c76;color:white;border:0;border-radius:8px;padding:12px;cursor:pointer}.score{font-size:36px;color:#78bfff}.offline{color:#ff9797}svg{width:100%;height:90px}#summary{padding:24px 0}small{color:#a9b9cf}</style><h1>SnowVision</h1><p>Петропавловск-Камчатский · мониторинг снегопада</p><p>Предварительная эвристическая оценка. Алгоритм требует калибровки на размеченных данных.</p><div id="summary">Загрузка камер…</div><div class="grid" id="grid"></div><script>
const fmt=t=>t?new Date(t*1000).toLocaleString('ru-RU',{timeZone:'Asia/Kamchatka'}):'—';
async function render(){try{const r=await fetch('/api/cameras');if(!r.ok)throw Error('API недоступен');const cams=await r.json();const s=await(await fetch('/api/summary')).json();summary.textContent=`Камер ${s.total} · доступны ${s.online} · признаки снега на реальных камерах ${s.snowing_real} · ${fmt(Date.now()/1000)}`;grid.innerHTML='';for(const c of cams){const o=c.observation||{};const el=document.createElement('article');el.innerHTML=`<img src="/api/cameras/${c.id}/snapshot?t=${Date.now()}" alt="Кадр пока недоступен"><section><small>${c.type==='demo'?'ДЕМОНСТРАЦИЯ · СИНТЕТИЧЕСКАЯ СЦЕНА':c.location}</small><h2>${c.name}</h2><div class="score">${o.snow_probability==null?'Недостаточно данных':Math.round(o.snow_probability*100)+'%'}</div><p class="${o.source_status==='offline'?'offline':''}">${({online:'Подключена',offline:'Источник недоступен',stale:'Кадр не меняется'})[o.source_status]||'Подключение'} · уверенность ${Math.round((o.confidence||0)*100)}%</p><small>Получение ${fmt(o.frame_timestamp)}<br>Анализ ${fmt(o.timestamp)}</small><p>${o.error||''}</p><button>История и технические сведения</button><div class="history"></div></section>`;el.querySelector('button').onclick=async()=>{const h=await(await fetch('/api/cameras/'+c.id+'/history')).json();el.querySelector('.history').innerHTML=`<p>OpenCV · ${c.type} · ${h.length} наблюдений</p><svg viewBox="0 0 400 100"><polyline fill="none" stroke="#78bfff" stroke-width="2" points="${h.map((v,i)=>v.snow_probability==null?'':`${i*400/Math.max(h.length-1,1)},${95-v.snow_probability*90}`).join(' ')}"/></svg><small>История оценки от 0 до 100%</small>`};grid.append(el)}if(!cams.length)grid.textContent='Камеры не настроены'}catch(e){summary.textContent='Ошибка загрузки · '+e.message}}render();setInterval(render,10000);
</script></html>
