services:
  snowvision:
    build: ./backend
    expose: ["8000"]
    mem_limit: 1536m
    environment:
      - SCENE_MODEL_URL=${SCENE_MODEL_URL:-http://vision:11434}
      - SCENE_MODEL_PROVIDER=${SCENE_MODEL_PROVIDER:-ollama}
      - SCENE_MODEL_NAME=${SCENE_MODEL_NAME:-gemma3:4b}
      - SNOWVISION_REQUIRE_VERIFIED_CITY_VIEW=${SNOWVISION_REQUIRE_VERIFIED_CITY_VIEW:-false}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_WEBHOOK_TOKEN=${ALERT_WEBHOOK_TOKEN:-}
      - X-Yandex-Weather-Key
    volumes: ["history:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
  vision:
    image: ollama/ollama@sha256:ccc42bcd3d5fcf7ab0d532b300382154e1a4da56fc666bdb313b78ebdd912754
    mem_limit: 6g
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_MAX_QUEUE=32
    volumes:
      - "${SNOWVISION_MODEL_DIR:-/mnt/disk_d/Development/kam4atka/snowvision-models}:/root/.ollama"
    restart: unless-stopped
  web:
    mem_limit: 256m
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      snowvision:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
  quality:
    profiles: ["quality"]
    build: ./backend
    entrypoint: ["python", "-m", "snowvision.cli.collect_quality"]
    volumes:
      - "${SNOWVISION_PILOT_DIR:-./.quality-local}:/pilot"
  quality-model:
    profiles: ["quality-model"]
    build:
      context: ./backend
      target: local-model
    network_mode: none
    entrypoint: ["python", "-m", "snowvision.cli.benchmark_clips"]
    volumes:
      - "${SNOWVISION_PILOT_DIR:-./.quality-local}:/pilot:ro"
volumes:
  history:
