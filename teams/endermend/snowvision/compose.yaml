services:
  snowvision:
    build: ./backend
    expose: ["8000"]
    environment:
      - SCENE_MODEL_URL=${SCENE_MODEL_URL:-}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_WEBHOOK_TOKEN=${ALERT_WEBHOOK_TOKEN:-}
      - X-Yandex-Weather-Key
    volumes: ["history:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
  web:
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      snowvision:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
  quality:
    profiles: ["quality"]
    build: ./backend
    entrypoint: ["python", "-m", "snowvision.cli.collect_quality"]
    volumes:
      - "${SNOWVISION_PILOT_DIR:-./.quality-local}:/pilot"
  quality-model:
    profiles: ["quality-model"]
    build:
      context: ./backend
      target: local-model
    network_mode: none
    entrypoint: ["python", "-m", "snowvision.cli.benchmark_clips"]
    volumes:
      - "${SNOWVISION_PILOT_DIR:-./.quality-local}:/pilot:ro"
volumes:
  history:
